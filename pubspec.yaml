name: mxff_ai
description: MXFF AI - futuristic Android AI assistant with animated orb, voice, floating overlay and phone actions.
publish_to: none
version: 2.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  speech_to_text: ^7.0.0
  record: ^5.1.2
  web_socket_channel: ^3.0.0
  flutter_tts: ^4.2.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#04060A"
  adaptive_icon_foreground: assets/icon_foreground.png

flutter:
  uses-material-design: true
